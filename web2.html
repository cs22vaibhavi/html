<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Product Image -->
        <div class="product-image">
            <img src="https://m.media-amazon.com/images/I/81d0cHFscuL._AC_.jpg" alt="Product Image">
        </div>

        <!-- Product Details -->
        <div class="product-details">

            <h1>Wireless Headphones</h1>

            <p class="brand">Brand: SoundMax</p>

            <p class="description">
                Experience premium sound quality with these wireless
                headphones featuring noise cancellation, long battery life,
                and comfortable design.
            </p>

            <h2 class="price">₹4,999</h2>

            <!-- Rating -->
            <div class="rating">
                ★★★★☆ (4.5)
            </div>

            <!-- Size Selection -->
            <div class="option">
                <label>Select Color:</label>

                <select>
                    <option>Black</option>
                    <option>White</option>
                    <option>Blue</option>
                </select>
            </div>

            <!-- Quantity -->
            <div class="option">
                <label>Quantity:</label>

                <input type="number" value="1" min="1">
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button class="cart-btn">Add to Cart</button>

                <button class="buy-btn">Buy Now</button>
            </div>

        </div>
    </div>

</body>
</html>
