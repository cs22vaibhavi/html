<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>My Shopping Cart 🛒</h1>
</header>

<div class="cart">

    <div class="product">
        <img src="https://via.placeholder.com/120" alt="Product">
        <div>
            <h2>Stylish Shoes</h2>
            <p>Price: ₹1500</p>
            <input type="number" value="1">
        </div>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/120" alt="Product">
        <div>
            <h2>Smart Watch</h2>
            <p>Price: ₹2500</p>
            <input type="number" value="1">
        </div>
    </div>


    <div class="summary">
        <h2>Cart Summary</h2>
        <p>Subtotal: ₹4000</p>
        <p>Delivery: Free</p>
        <h3>Total: ₹4000</h3>

        <button>Proceed to Checkout</button>
    </div>

</div>


<footer>
    <p>© 2026 My Shop</p>
</footer>

</body>
</html>
