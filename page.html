<!DOCTYPE html>
<html>
<head>
    <title>Header Sidebar Footer Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            min-height: 400px;
        }

        sidebar {
            width: 25%;
        }

        .sidebar {
            background-color: #f2f2f2;
            width: 25%;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: black;
        }

        .sidebar a:hover {
            background-color: #ddd;
        }

        .main {
            width: 75%;
            padding: 20px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>

</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my webpage</p>
    </header>


    <div class="container">

        <div class="sidebar">
            <h2>Sidebar</h2>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>


        <div class="main">
            <h2>Main Content</h2>
            <p>
                This is the main section of the webpage.
                You can add your content here.
            </p>

            <p>
                HTML and CSS are used to create this simple layout.
            </p>
        </div>

    </div>


    <footer>
        <p>© 2026 My Website | All Rights Reserved</p>
    </footer>


</body>
</html>
