<!DOCTYPE html>
<html>
<head>
<title>Flex Box</title>

<style>

.container{
    display:flex;
    gap:20px;
    justify-content:center;
}

.box{
    width:150px;
    height:150px;
    background:skyblue;
    text-align:center;
    padding-top:50px;
    font-size:20px;
}

</style>

</head>

<body>

<h1>Flex Box Example</h1>

<div class="container">

    <div class="box">Box 1</div>

    <div class="box">Box 2</div>

    <div class="box">Box 3</div>

</div>

</body>
</html>
